name: daily

# Rotina diaria do Bem na Mosca no GitHub Actions.
#
# Quatro disparos por manha (10:00, 10:30, 11:00, 11:30 em Brasilia = UTC-3).
# Cada disparo e uma maquina nova; `python main.py daily` le output/daily_state.json
# (versionado de volta no repo) e SO executa as etapas que ainda nao sairam hoje.
# Portanto: o primeiro disparo que der certo faz tudo, os seguintes terminam em
# segundos; se o LLM ou o render falhar, o proximo disparo e a retentativa.
# Cron do GitHub pode atrasar ate ~30 min em horario de pico — o agendamento do
# YouTube (youtube.schedule.hourly_fallback) ja lida com isso.

on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "30 13 * * *"
    - cron: "0 14 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Gera tudo mas NAO publica (youtube/instagram desligados)"
        type: boolean
        default: false

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ffmpeg (com libass) e tzdata
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tzdata > /dev/null
          ffmpeg -version | head -1

      - name: Dependencias
        run: pip install -q -r requirements.txt

      - name: Videos do rodizio (cache do release loop-v1)
        id: loopcache
        uses: actions/cache@v4
        with:
          path: videos/loop
          key: loop-v1

      - name: Baixar videos do rodizio (so quando o cache esta vazio)
        if: steps.loopcache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p videos/loop
          gh release download loop-v1 --repo ${{ github.repository }} --dir videos/loop --pattern "*.mp4"
          ls videos/loop | wc -l

      - name: Segredos -> arquivos
        env:
          ELEVENLABS_API_KEYS: ${{ secrets.ELEVENLABS_API_KEYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY_IMG: ${{ secrets.GEMINI_API_KEY_IMG }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          PEXELS_API_KEYS: ${{ secrets.PEXELS_API_KEYS }}
          SERPER_API_KEYS: ${{ secrets.SERPER_API_KEYS }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          DB_ARCHIVE_GITHUB_TOKEN: ${{ secrets.DB_ARCHIVE_GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          INSTAGRAM_TOKEN_JSON: ${{ secrets.INSTAGRAM_TOKEN_JSON }}
        run: python scripts/ci_bootstrap.py

      - name: Dry run (desliga publicacao)
        if: ${{ inputs.dry_run }}
        run: |
          python - <<'EOF'
          # Flip exactly the publishing switches. (The first version used a
          # regex on "enabled: true" and hit tracking/subtitles instead — the
          # "dry run" of 22/08 published for real.)
          import yaml, pathlib
          p = pathlib.Path("config.yaml"); c = yaml.safe_load(p.read_text(encoding="utf-8"))
          c.setdefault("youtube", {})["enabled"] = False
          c.setdefault("instagram", {})["enabled"] = False
          c.setdefault("carousel", {})["publish_youtube"] = False
          c["carousel"]["publish_reel"] = False
          p.write_text(yaml.safe_dump(c, allow_unicode=True, sort_keys=False), encoding="utf-8")
          print("dry run: youtube.enabled / instagram.enabled / carousel.publish_* = False")
          EOF

      - name: Rotina diaria
        env:
          DAILY_CI: "1"
          TZ: America/Sao_Paulo
          PYTHONIOENCODING: utf-8
          IMAGEIO_FFMPEG_EXE: /usr/bin/ffmpeg
        run: python -u main.py daily 2>&1 | tee output/daily_run.log

      - name: Pacote do dia (slides, linkedin.jpg/.txt, video) como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacote-${{ github.run_id }}
          path: |
            output/carousels/**
            output/daily_run.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Token do Instagram renovado -> secret
        if: always() && !inputs.dry_run && env.GH_PAT != ''
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -f output/instagram_token.json ]; then
            GH_TOKEN="$GH_PAT" gh secret set INSTAGRAM_TOKEN_JSON --repo ${{ github.repository }} < output/instagram_token.json
            echo "INSTAGRAM_TOKEN_JSON atualizado"
          fi

      - name: Estado de volta no repositorio
        # Never after a dry run: nothing was published, so nothing may be
        # recorded as done (rotation, history, slots, daily_state).
        if: always() && !inputs.dry_run
        run: |
          git config user.name "bemnamosca-bot"
          git config user.email "bot@bemnamosca.local"
          git add -f output/daily_state.json output/history.json output/loop_rotation.json \
                     output/schedule_state.json output/hook_history.json output/media_usage.json \
                     output/keyword_cache.json 2>/dev/null || true
          git add -f assets/images/ai/*.png assets/images/ai/*.jpg 2>/dev/null || true
          git add -f output/daily_log.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "state: $(TZ=America/Sao_Paulo date +'%Y-%m-%d %H:%M') [skip ci]"
            git pull --rebase -q origin ${{ github.ref_name }} || true
            git push -q
          else
            echo "nada a salvar"
          fi
